{% extends 'base.html' %}{% block title %}Notifications{% endblock %}
{% block content %}<div class="d-flex justify-content-between mb-3"><h1 class="h3 mb-0">Notifications</h1>
<form method="post" action="{% url 'notifications:read_all' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-tl" type="submit">Mark all as read</button></form></div>
<div class="list-group">{% for n in items %}<div class="list-group-item d-flex justify-content-between align-items-center {% if not n.is_read %}fw-semibold{% endif %}"><span>{{ n.message }} <small class="text-muted d-block">{{ n.created_at|timesince }} ago</small></span>
<form method="post" action="{% url 'notifications:read' n.pk %}">{% csrf_token %}<button class="btn btn-sm btn-link" type="submit">{% if n.url %}Open{% else %}Dismiss{% endif %}</button></form></div>
{% empty %}<div class="list-group-item text-muted">You are all caught up.</div>{% endfor %}</div>{% endblock %}
