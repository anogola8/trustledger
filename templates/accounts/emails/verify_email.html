<!doctype html>
<html><body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #0d6efd;">Welcome to TrustLedger</h2>
  <p>Hi {{ user.get_full_name|default:user.email }},</p>
  <p>Please confirm your email address by clicking the button below:</p>
  <p style="text-align: center; margin: 30px 0;">
    <a href="{{ verify_url }}" style="background: #0d6efd; color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold;">
      Verify my email
    </a>
  </p>
  <p style="color: #666;">Or copy this link:</p>
  <p style="word-break: break-all; color: #0d6efd; background: #f8f9fa; padding: 10px;">{{ verify_url }}</p>
  <p style="color: #999; font-size: 13px;">This link expires in 3 days.</p>
  <hr><p style="color: #999; font-size: 12px; text-align: center;">TrustLedger</p>
</body></html>
