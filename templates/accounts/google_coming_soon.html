{% extends 'base.html' %}
{% block title %}Google Sign-in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-5 text-center">
        <div style="font-size: 3rem;">🔒</div>
        <h1 class="h4 mt-3 mb-2">Google Sign-in Coming Soon</h1>
        <p class="text-muted mb-4">
          Google OAuth is being set up for production. For now, please use your email or username to log in.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">← Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
