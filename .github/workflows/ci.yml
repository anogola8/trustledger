name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trustledger
          POSTGRES_USER: trustledger
          POSTGRES_PASSWORD: trustledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Match settings.py var names
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production-use-only"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://testserver"
      DATABASE_URL: "postgres://trustledger:trustledger@localhost:5432/trustledger"
      KEY_ENCRYPTION_KEY: "KvxgTd-nWqY7_iPJ_-ducwPOAb1tW4M8i36Ri5HA_CY="

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run tests with coverage
        run: |
          coverage run --source=. --omit='*/migrations/*,tests/*,manage.py,config/wsgi.py' manage.py test tests
          coverage report --fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t trustledger .