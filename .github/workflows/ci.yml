name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: trustledger, POSTGRES_USER: trustledger, POSTGRES_PASSWORD: trustledger }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "1"
      DATABASE_URL: postgres://trustledger:trustledger@localhost:5432/trustledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run --source=. --omit='*/migrations/*,tests/*,manage.py,config/wsgi.py' manage.py test tests
      - run: coverage report --fail-under=80
      - name: Deployment checks
        run: SECRET_KEY=x DEBUG=0 KEY_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") python manage.py check --deploy
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trustledger .
